<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="bookmarks.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bookmarks-layout">
    <header class="bookmarks-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#FF7626"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <h1>Bookmarks Manager</h1>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8C92A4" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="bmSearch" placeholder="Search bookmarks..." autocomplete="off">
        </div>
        <button class="primary-btn" id="addBookmarkBtn">+ Add Bookmark</button>
      </div>
    </header>

    <main class="bookmarks-body" id="bookmarksBody">
      <!-- Bookmarks List -->
    </main>
  </div>

  <script src="bookmarks.js"></script>
</body>
</html>
