<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="history.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="history-layout">
    <header class="history-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FF7626" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <h1>Browsing History</h1>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8C92A4" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="historySearch" placeholder="Search history..." autocomplete="off">
        </div>
        <button class="clear-btn" id="clearHistoryBtn">Clear Browsing Data</button>
      </div>
    </header>

    <main class="history-body" id="historyBody">
      <!-- Grouped by Date -->
    </main>
  </div>

  <script src="history.js"></script>
</body>
</html>
