<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="wallpaper-bg">
  <div class="wallpaper-overlay"></div>

  <!-- Main Content Container -->
  <main class="dashboard">
    <!-- Top Row: Brave Shields Stats -->
    <header class="stats-row" id="statsRow">
      <div class="stat-card glass-card">
        <div class="stat-icon lion-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#FF7626"><path d="M12 2L4 7V15C4 22.38 9.12 29.23 12 31C14.88 29.23 20 22.38 20 15V7L12 2Z"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="adsBlockedCount">1,420</span>
          <span class="stat-label">Trackers & ads blocked</span>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon bandwidth-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#36B37E" stroke-width="2.2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="bandwidthSaved">29.5 MB</span>
          <span class="stat-label">Bandwidth saved</span>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon time-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#4C9AFF" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="timeSaved">45 s</span>
          <span class="stat-label">Time saved</span>
        </div>
      </div>
    </header>

    <!-- Center Section: Clock, Greeting & Search Bar -->
    <section class="center-section">
      <div class="clock-container" id="clockSection">
        <h1 class="clock-time" id="clockDisplay">12:00</h1>
        <p class="greeting" id="greetingDisplay">Welcome to Brave</p>
      </div>

      <div class="search-box glass-card">
        <div class="search-engine-badge">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#FF7626"><path d="M12 2L4 7V15C4 22.38 9.12 29.23 12 31C14.88 29.23 20 22.38 20 15V7L12 2Z"/></svg>
        </div>
        <input type="text" id="searchInput" placeholder="Search the web privately with Brave Search..." autocomplete="off">
        <button class="search-submit-btn" id="searchBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>

      <!-- Top Sites Speed Dial -->
      <div class="top-sites-grid" id="topSitesGrid">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Bottom Section: Brave News Feed preview -->
    <section class="news-section" id="newsSection">
      <div class="news-header">
        <div class="news-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#FF7626"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          <h2>Brave News</h2>
          <span class="news-badge">Privacy & Tech</span>
        </div>
        <button class="btn-text" id="refreshNewsBtn">Refresh Feed</button>
      </div>
      <div class="news-grid" id="newsGrid">
        <!-- News cards loaded here -->
      </div>
    </section>
  </main>

  <!-- Bottom Bar Controls -->
  <footer class="bottom-bar">
    <div class="wallpaper-info" id="wallpaperInfo">
      <span class="photo-by">Photo: Sierra Twilight Wilderness</span>
    </div>
    <div class="footer-actions">
      <button class="footer-btn" id="nextWallpaperBtn" title="Change wallpaper">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Change Image
      </button>
      <button class="footer-btn" id="customizeBtn" title="Customize dashboard">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Customize
      </button>
    </div>
  </footer>

  <!-- Customize Modal Drawer -->
  <div class="customize-drawer" id="customizeDrawer">
    <div class="drawer-header">
      <h3>Customize Dashboard</h3>
      <button class="close-drawer-btn" id="closeDrawerBtn">&times;</button>
    </div>
    <div class="drawer-body">
      <div class="toggle-row">
        <span>Background Images</span>
        <label class="switch"><input type="checkbox" id="toggleWallpaper" checked><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span>Brave Shields Stats</span>
        <label class="switch"><input type="checkbox" id="toggleStats" checked><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span>Clock & Greeting</span>
        <label class="switch"><input type="checkbox" id="toggleClock" checked><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span>Top Sites Speed Dial</span>
        <label class="switch"><input type="checkbox" id="toggleTopSites" checked><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span>Brave News Feed</span>
        <label class="switch"><input type="checkbox" id="toggleNews" checked><span class="slider"></span></label>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
