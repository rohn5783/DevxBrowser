<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brave Playlist</title>
  <link rel="stylesheet" href="playlist.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="playlist-container">
    <header class="playlist-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#FF7626" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div>
          <h1>Brave Playlist & Reading List</h1>
          <p>Saved articles and media available offline without ads or interruptions.</p>
        </div>
      </div>
      <button class="primary-btn" id="addToPlaylistBtn">+ Add Item</button>
    </header>

    <main class="playlist-grid" id="playlistGrid">
      <!-- Playlist items rendered dynamically -->
    </main>
  </div>

  <script src="playlist.js"></script>
</body>
</html>
